<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="stripe" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="none"/><line x1="0" y1="0" x2="0" y2="8" stroke="#a78bfa" stroke-width="4"/></pattern>
  </defs>
</svg>

<div class="bg"><i></i><i></i><i></i></div>

<div id="splash">
  <div class="logo">
    <div class="ring-spin"></div>
    <svg viewBox="0 0 150 150">
      <polygon class="hex2" points="75,13 128.7,44 128.7,106 75,137 21.3,106 21.3,44"/>
      <polygon class="hex" points="75,13 128.7,44 128.7,106 75,137 21.3,106 21.3,44"/>
      <text x="75" y="91" text-anchor="middle">IQ</text>
    </svg>
  </div>

  <div class="mut" style="animation:fadeUp 1s .8s both">در حال آماده‌سازی…</div>
